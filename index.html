<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>奶茶店大作战</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        overflow: hidden;
        background: #fdf5e6;
        font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
    }
    canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        touch-action: none;
    }
    .screen-overlay {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 10;
        color: #fff;
    }
    .hidden { display: none !important; }

    #main-screen {
        background: linear-gradient(160deg, #fff4e6 0%, #fce4c4 100%);
        color: #6b4226;
        text-align: center;
    }
    #main-screen h1 {
        font-size: 42px;
        color: #c87f3a;
        text-shadow: 2px 2px 0 rgba(255,255,255,0.6);
        margin-bottom: 20px;
    }
    #main-screen p {
        font-size: 16px;
        margin: 8px 0;
        color: #8b6a45;
        line-height: 1.7;
    }
    #main-screen .highlight { color: #d2691e; font-weight: bold; }
    #main-screen .danger { color: #c0392b; font-weight: bold; }
    .btn {
        margin-top: 20px;
        padding: 14px 42px;
        font-size: 20px;
        background: #c87f3a;
        color: #fff;
        border: none;
        border-radius: 25px;
        cursor: pointer;
        box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        transition: transform 0.1s;
        font-weight: bold;
    }
    .btn:active { transform: scale(0.95); }
    .btn-small {
        padding: 10px 28px;
        font-size: 16px;
        border-radius: 20px;
        margin: 8px 6px;
    }

    #ui-layer {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
        z-index: 5;
        padding: 15px 20px;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
    }
    #hud-left, #hud-right {
        font-size: 20px;
        font-weight: bold;
        color: #6b4226;
        text-shadow: 1px 1px 2px rgba(255,255,255,0.9);
    }
    #pause-btn {
        pointer-events: auto;
        background: rgba(255,255,255,0.9);
        border: 2px solid #c87f3a;
        color: #6b4226;
        border-radius: 15px;
        padding: 6px 16px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        margin-left: 15px;
    }

    #pause-screen {
        background: rgba(60, 30, 10, 0.75);
    }
    #pause-screen h2 { font-size: 32px; margin-bottom: 20px; }

    #end-screen {
        background: rgba(60, 30, 10, 0.85);
    }
    #end-screen h2 { font-size: 34px; color: #ffd27f; margin-bottom: 20px; }
    #end-screen p { font-size: 20px; margin: 8px 0; }
    #end-screen .rating {
        font-size: 32px;
        font-weight: bold;
        margin: 20px 0;
        color: #ffd27f;
    }
    #end-screen .sub-stats {
        font-size: 14px;
        color: #d4b896;
        margin-top: 10px;
        text-align: center;
    }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="ui-layer">
    <div id="hud-left">分数: <span id="scoreDisplay">0</span></div>
    <div id="hud-right">
        时间: <span id="timeDisplay">60</span>s
        <button id="pause-btn">⏸</button>
    </div>
</div>

<div id="main-screen" class="screen-overlay">
    <h1>🧋 奶茶店大作战</h1>
    <p>小料从上方掉落，拖动杯子接住顾客要的那一种</p>
    <p>接对 <span class="highlight">+10分</span>，接错 <span class="danger">-5分</span></p>
    <p>订单时限过半内完成，额外 <span class="highlight">+5分</span></p>
    <br>
    <p style="font-size: 14px; color: #a88a6a;">🖱 鼠标拖动 / 📱 手指滑动 / ⌨ A 和 D 键</p>
    <button id="start-btn" class="btn">开始营业</button>
</div>

<div id="pause-screen" class="screen-overlay hidden">
    <h2>暂停中...</h2>
    <button id="resume-btn" class="btn">继续营业</button>
    <button id="quit-btn" class="btn btn-small" style="background:#8a6a4a;">直接结算</button>
</div>

<div id="end-screen" class="screen-overlay hidden">
    <h2>营业结束</h2>
    <p>最终得分：<span id="finalScore">0</span></p>
    <p class="rating" id="finalRating">良好</p>
    <div class="sub-stats">
        完成订单：<span id="orderCount">0</span> 个<br>
        接对小料：<span id="correctCount">0</span> 次<br>
        接错小料：<span id="wrongCount">0</span> 次
    </div>
    <button id="restart-btn" class="btn">再来一局</button>
    <button id="home-btn" class="btn btn-small" style="background:#8a6a4a;">回到主界面</button>
</div>

<script>
// ================= 配置参数 =================
const CONFIG = {
    gameDuration: 60,
    cup: {
        width: 110,
        height: 85,
        bottomMargin: 40,
        keySpeed: 720,
    },
    topping: {
        baseSpeed: 200,
        speedPerSec: 2.2,
        baseSpawnInterval: 0.72,
        minSpawnInterval: 0.38,
        spawnDecayPerSec: 0.006,
        radius: 16,
    },
    order: {
        maxActive: 2,
        durationMin: 6,
        durationMax: 10,
        spawnIntervalMin: 1.8,
        spawnIntervalMax: 3.2,
        correctScore: 10,
        wrongScore: -5,
        earlyBonus: 5,
    },
};

const TOPPINGS = [
    { id: 'pearl',   name: '珍珠', color: '#3d2010', accent: '#1a0c04' },
    { id: 'coconut', name: '椰果', color: '#f5efe0', accent: '#c8bda0' },
    { id: 'redbean', name: '红豆', color: '#922e1e', accent: '#5c1a10' },
];

// ================= 初始化 =================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let width, height;

function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    if (state !== 'playing') {
        cup.x = width / 2;
        cup.y = height - CONFIG.cup.bottomMargin - CONFIG.cup.height;
    }
}
window.addEventListener('resize', resize);

const scoreDisplay = document.getElementById('scoreDisplay');
const timeDisplay = document.getElementById('timeDisplay');
const mainScreen = document.getElementById('main-screen');
const pauseScreen = document.getElementById('pause-screen');
const endScreen = document.getElementById('end-screen');
const finalScoreEl = document.getElementById('finalScore');
const finalRatingEl = document.getElementById('finalRating');
const orderCountEl = document.getElementById('orderCount');
const correctCountEl = document.getElementById('correctCount');
const wrongCountEl = document.getElementById('wrongCount');

// ================= 游戏状态 =================
let state = 'ready'; // ready | playing | paused | ended
let score = 0;
let timeLeft = CONFIG.gameDuration;
let lastTime = 0;
let elapsed = 0;

let cup = { x: 0, y: 0 };
let toppings = [];
let orders = [];
let particles = [];
let floatTexts = [];

let toppingSpawnTimer = 0;
let orderSpawnTimer = 1.0;

let stats = { orders: 0, correct: 0, wrong: 0 };

// 输入
const keys = { a: false, d: false };
let pointerTargetX = null;
let lastInput = 'pointer';
let isDragging = false;        // ★ 是否正在按住杯子
let dragOffsetX = 0;           // ★ 按住点相对杯子中心的偏移

// ================= 音频（Web Audio API） =================
let audioCtx = null;
function initAudio() {
    if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        catch (e) { console.log('无音频支持'); }
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function playSound(freq, duration, type = 'sine', volume = 0.1, freqEnd = null) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);
    if (freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, now + duration);
    gain.gain.setValueAtTime(volume, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + duration);
}

function soundCorrect() {
    playSound(880, 0.12, 'sine', 0.1, 1100);
    setTimeout(() => playSound(1200, 0.15, 'sine', 0.08, 1400), 80);
}
function soundWrong() {
    playSound(200, 0.25, 'triangle', 0.12, 100);
}
function soundOrderComplete() {
    playSound(660, 0.1, 'sine', 0.08, 880);
    setTimeout(() => playSound(880, 0.1, 'sine', 0.08, 1100), 90);
    setTimeout(() => playSound(1100, 0.18, 'sine', 0.08, 1320), 180);
}

// ================= 游戏对象 =================
function spawnTopping() {
    const tpl = TOPPINGS[Math.floor(Math.random() * TOPPINGS.length)];
    const x = 40 + Math.random() * (width - 80);
    const speed = CONFIG.topping.baseSpeed + elapsed * CONFIG.topping.speedPerSec;
    toppings.push({
        x: x,
        y: 110,
        vy: speed,
        type: tpl.id,
        rotation: Math.random() * Math.PI * 2,
        rotationSpeed: (Math.random() - 0.5) * 3,
    });
}

function spawnOrder() {
    const tpl = TOPPINGS[Math.floor(Math.random() * TOPPINGS.length)];
    const duration = CONFIG.order.durationMin + Math.random() * (CONFIG.order.durationMax - CONFIG.order.durationMin);
    orders.push({
        toppingId: tpl.id,
        toppingName: tpl.name,
        duration: duration,
        timeLeft: duration,
        avatarSeed: Math.floor(Math.random() * 4),
        shakePhase: Math.random() * Math.PI * 2,
    });
}

function spawnParticles(x, y, color, count = 10) {
    for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 / count) * i + Math.random() * 0.5;
        const speed = 80 + Math.random() * 100;
        particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 30,
            life: 0.6,
            maxLife: 0.6,
            color: color,
            size: 3 + Math.random() * 3,
        });
    }
}

function spawnFloatText(x, y, text, color) {
    floatTexts.push({
        x, y,
        text, color,
        life: 1.0,
        maxLife: 1.0,
        vy: -60,
    });
}

// ================= 逻辑更新 =================
function update(dt) {
    elapsed = CONFIG.gameDuration - timeLeft;

    // 时间
    timeLeft -= dt;
    if (timeLeft <= 0) {
        timeLeft = 0;
        updateHUD();
        endGame();
        return;
    }
    updateHUD();

    // 杯子控制
    if (lastInput === 'pointer' && pointerTargetX !== null) {
        cup.x = pointerTargetX;
    } else {
        if (keys.a) cup.x -= CONFIG.cup.keySpeed * dt;
        if (keys.d) cup.x += CONFIG.cup.keySpeed * dt;
    }
    cup.x = Math.max(CONFIG.cup.width / 2 + 4, Math.min(width - CONFIG.cup.width / 2 - 4, cup.x));

    // 小料生成
    toppingSpawnTimer -= dt;
    if (toppingSpawnTimer <= 0) {
        spawnTopping();
        const interval = Math.max(
            CONFIG.topping.minSpawnInterval,
            CONFIG.topping.baseSpawnInterval - elapsed * CONFIG.topping.spawnDecayPerSec
        );
        toppingSpawnTimer = interval * (0.85 + Math.random() * 0.3);
    }

    // 更新小料
    for (let i = toppings.length - 1; i >= 0; i--) {
        const t = toppings[i];
        t.y += t.vy * dt;
        t.rotation += t.rotationSpeed * dt;

        // 碰撞检测：小料底部进入杯子顶部区域
        const cupTop = cup.y;
        const cupBottom = cup.y + CONFIG.cup.height;
        const cupLeft = cup.x - CONFIG.cup.width / 2 + 6;
        const cupRight = cup.x + CONFIG.cup.width / 2 - 6;

        if (t.y + CONFIG.topping.radius >= cupTop && t.y < cupBottom) {
            if (t.x >= cupLeft && t.x <= cupRight) {
                handleCatch(t);
                toppings.splice(i, 1);
                continue;
            }
        }

        if (t.y - CONFIG.topping.radius > height) {
            toppings.splice(i, 1);
        }
    }

    // 订单生成
    orderSpawnTimer -= dt;
    if (orderSpawnTimer <= 0 && orders.length < CONFIG.order.maxActive) {
        spawnOrder();
        orderSpawnTimer = CONFIG.order.spawnIntervalMin + Math.random() *
            (CONFIG.order.spawnIntervalMax - CONFIG.order.spawnIntervalMin);
    }

    // 更新订单
    for (let i = orders.length - 1; i >= 0; i--) {
        orders[i].timeLeft -= dt;
        orders[i].shakePhase += dt * 5;
        if (orders[i].timeLeft <= 0) {
            spawnFloatText(width / 2, height / 2, '订单超时!', '#c0392b');
            orders.splice(i, 1);
        }
    }

    // 更新粒子
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 400 * dt;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // 更新飘字
    for (let i = floatTexts.length - 1; i >= 0; i--) {
        const ft = floatTexts[i];
        ft.y += ft.vy * dt;
        ft.life -= dt;
        if (ft.life <= 0) floatTexts.splice(i, 1);
    }
}

function handleCatch(topping) {
    // 找匹配的订单
    let matchIndex = -1;
    for (let i = 0; i < orders.length; i++) {
        if (orders[i].toppingId === topping.type) {
            matchIndex = i;
            break;
        }
    }

    if (matchIndex >= 0) {
        const order = orders[matchIndex];
        const timeRatio = order.timeLeft / order.duration;
        let points = CONFIG.order.correctScore;
        let bonus = false;

        if (timeRatio > 0.5) {
            points += CONFIG.order.earlyBonus;
            bonus = true;
        }

        score += points;
        stats.orders++;
        stats.correct++;

        const tpl = TOPPINGS.find(t => t.id === topping.type);
        spawnParticles(topping.x, cup.y, tpl.color, 14);
        spawnFloatText(topping.x, cup.y - 20, '+' + points + (bonus ? ' 快!' : ''), bonus ? '#e67e22' : '#27ae60');
        soundOrderComplete();

        orders.splice(matchIndex, 1);
    } else {
        // 没有匹配订单，扣分
        score += CONFIG.order.wrongScore;
        stats.wrong++;
        spawnFloatText(topping.x, cup.y - 20, CONFIG.order.wrongScore, '#c0392b');
        soundWrong();
    }
}

function updateHUD() {
    scoreDisplay.textContent = score;
    timeDisplay.textContent = Math.ceil(timeLeft);
}

// ================= 绘制 =================
function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
}

function drawBackground() {
    const grad = ctx.createLinearGradient(0, 0, 0, height);
    grad.addColorStop(0, '#fff8ec');
    grad.addColorStop(1, '#f5e0c0');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, width, height);

    // 装饰性花纹
    ctx.globalAlpha = 0.05;
    ctx.fillStyle = '#a0522d';
    for (let i = 0; i < 6; i++) {
        ctx.beginPath();
        ctx.arc(width * (0.1 + i * 0.16), height * 0.4, 60, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;

    // 桌面
    ctx.fillStyle = '#d8b88a';
    ctx.fillRect(0, height - 20, width, 20);
    ctx.fillStyle = '#b88f5a';
    ctx.fillRect(0, height - 20, width, 4);
}

function drawToppingShape(tpl, x, y, size, rotation = 0) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rotation);

    if (tpl.id === 'pearl') {
        const g = ctx.createRadialGradient(-size * 0.3, -size * 0.3, 2, 0, 0, size);
        g.addColorStop(0, '#6a3818');
        g.addColorStop(1, '#1a0c04');
        ctx.beginPath();
        ctx.arc(0, 0, size, 0, Math.PI * 2);
        ctx.fillStyle = g;
        ctx.fill();
        ctx.beginPath();
        ctx.arc(-size * 0.35, -size * 0.35, size * 0.25, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.fill();
    } else if (tpl.id === 'coconut') {
        roundRect(-size, -size, size * 2, size * 2, 4);
        ctx.fillStyle = '#f5efe0';
        ctx.fill();
        ctx.strokeStyle = '#c8bda0';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        ctx.fillRect(-size * 0.6, -size * 0.6, size * 0.5, size * 0.5);
    } else if (tpl.id === 'redbean') {
        ctx.beginPath();
        ctx.ellipse(0, 0, size * 1.1, size * 0.8, 0.3, 0, Math.PI * 2);
        const g = ctx.createRadialGradient(-size * 0.3, -size * 0.3, 2, 0, 0, size);
        g.addColorStop(0, '#b04434');
        g.addColorStop(1, '#6b1f13');
        ctx.fillStyle = g;
        ctx.fill();
        ctx.strokeStyle = '#4a1208';
        ctx.lineWidth = 1.5;
        ctx.stroke();
    }

    ctx.restore();
}

function drawTopping(t) {
    const tpl = TOPPINGS.find(x => x.id === t.type);
    drawToppingShape(tpl, t.x, t.y, CONFIG.topping.radius, t.rotation);
}

function drawCup() {
    const w = CONFIG.cup.width;
    const h = CONFIG.cup.height;
    const x = cup.x;
    const y = cup.y;

    // 杯身
    ctx.beginPath();
    ctx.moveTo(x - w / 2, y);
    ctx.lineTo(x + w / 2, y);
    ctx.lineTo(x + w / 2 - 10, y + h);
    ctx.lineTo(x - w / 2 + 10, y + h);
    ctx.closePath();

    const grad = ctx.createLinearGradient(x, y, x, y + h);
    grad.addColorStop(0, '#fcebd0');
    grad.addColorStop(1, '#d4a878');
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.strokeStyle = '#8b6a45';
    ctx.lineWidth = 3;
    ctx.stroke();

    // 奶茶内容（底层）
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(x - w / 2 + 6, y + h * 0.35);
    ctx.lineTo(x + w / 2 - 6, y + h * 0.35);
    ctx.lineTo(x + w / 2 - 10, y + h - 4);
    ctx.lineTo(x - w / 2 + 10, y + h - 4);
    ctx.closePath();
    ctx.fillStyle = 'rgba(180, 120, 70, 0.5)';
    ctx.fill();
    ctx.restore();

    // 杯口
    ctx.beginPath();
    ctx.ellipse(x, y, w / 2, 7, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#fdf0dc';
    ctx.fill();
    ctx.strokeStyle = '#8b6a45';
    ctx.lineWidth = 3;
    ctx.stroke();

    // 吸管
    ctx.beginPath();
    ctx.moveTo(x + 14, y - 48);
    ctx.lineTo(x + 6, y + 20);
    ctx.strokeStyle = '#e74c3c';
    ctx.lineWidth = 8;
    ctx.lineCap = 'round';
    ctx.stroke();
    ctx.strokeStyle = '#c0392b';
    ctx.lineWidth = 2;
    ctx.stroke();

    // 高光
    ctx.beginPath();
    ctx.moveTo(x - w / 2 + 14, y + 15);
    ctx.lineTo(x - w / 2 + 20, y + h - 15);
    ctx.strokeStyle = 'rgba(255,255,255,0.6)';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.stroke();
}

function drawOrderCard(order, index) {
    const cardW = Math.min(210, width * 0.45);
    const cardH = 80;
    const padding = 12;
    const x = padding + index * (cardW + padding);
    const y = 60;

    // 卡片背景
    ctx.save();
    // 快过期抖动
    const timeRatio = order.timeLeft / order.duration;
    let shakeX = 0;
    if (timeRatio < 0.3) {
        shakeX = Math.sin(order.shakePhase * 3) * 2;
    }
    ctx.translate(shakeX, 0);

    // 阴影
    ctx.fillStyle = 'rgba(0,0,0,0.1)';
    roundRect(x + 2, y + 3, cardW, cardH, 12);
    ctx.fill();

    // 卡片主体
    roundRect(x, y, cardW, cardH, 12);
    ctx.fillStyle = '#fff8ec';
    ctx.fill();
    ctx.strokeStyle = timeRatio < 0.3 ? '#c0392b' : '#d4a373';
    ctx.lineWidth = timeRatio < 0.3 ? 3 : 2;
    ctx.stroke();

    // 顾客头像
    const avatarX = x + 32;
    const avatarY = y + cardH / 2;
    const avatarR = 22;

    ctx.beginPath();
    ctx.arc(avatarX, avatarY, avatarR, 0, Math.PI * 2);
    const avatarColors = ['#f5b8a0', '#f0d4a0', '#d8b8e0', '#a8d0e0'];
    ctx.fillStyle = avatarColors[order.avatarSeed % avatarColors.length];
    ctx.fill();
    ctx.strokeStyle = '#8b6a45';
    ctx.lineWidth = 2;
    ctx.stroke();

    // 简单表情
    ctx.fillStyle = '#4a3520';
    ctx.beginPath();
    ctx.arc(avatarX - 7, avatarY - 4, 2.5, 0, Math.PI * 2);
    ctx.arc(avatarX + 7, avatarY - 4, 2.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(avatarX, avatarY + 5, 6, 0.15 * Math.PI, 0.85 * Math.PI);
    ctx.strokeStyle = '#4a3520';
    ctx.lineWidth = 2;
    ctx.stroke();

    // 需求小料图标
    const tpl = TOPPINGS.find(t => t.id === order.toppingId);
    const iconX = x + 75;
    const iconY = y + 30;
    drawToppingShape(tpl, iconX, iconY, 14, 0);

    // 需求文字
    ctx.fillStyle = '#6b4226';
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText('要 ' + order.toppingName, iconX + 20, iconY);

    // 时间条
    const barX = x + 70;
    const barY = y + 52;
    const barW = cardW - 85;
    const barH = 8;
    ctx.fillStyle = '#eee0cc';
    roundRect(barX, barY, barW, barH, 4);
    ctx.fill();

    ctx.fillStyle = timeRatio < 0.3 ? '#c0392b' : (timeRatio < 0.6 ? '#e67e22' : '#27ae60');
    roundRect(barX, barY, barW * timeRatio, barH, 4);
    ctx.fill();

    ctx.restore();
}

function drawParticles() {
    particles.forEach(p => {
        ctx.globalAlpha = p.life / p.maxLife;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.globalAlpha = 1;
}

function drawFloatTexts() {
    floatTexts.forEach(ft => {
        ctx.globalAlpha = ft.life / ft.maxLife;
        ctx.fillStyle = ft.color;
        ctx.font = 'bold 22px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.strokeStyle = 'rgba(255,255,255,0.9)';
        ctx.lineWidth = 4;
        ctx.strokeText(ft.text, ft.x, ft.y);
        ctx.fillText(ft.text, ft.x, ft.y);
    });
    ctx.globalAlpha = 1;
}

function render() {
    ctx.clearRect(0, 0, width, height);
    drawBackground();

    // 订单卡片（最上层）
    orders.forEach((o, i) => drawOrderCard(o, i));

    // 小料
    toppings.forEach(t => drawTopping(t));

    // 杯子
    drawCup();

    // 粒子
    drawParticles();

    // 飘字
    drawFloatTexts();
}

// ================= 主循环 =================
function gameLoop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    let dt = (timestamp - lastTime) / 1000;
    lastTime = timestamp;
    if (dt > 0.1) dt = 0.1;

    if (state === 'playing') {
        update(dt);
    }
    render();

    requestAnimationFrame(gameLoop);
}

// ================= 游戏流程 =================
function startGame() {
    initAudio();
    state = 'playing';
    score = 0;
    timeLeft = CONFIG.gameDuration;
    elapsed = 0;
    toppings = [];
    orders = [];
    particles = [];
    floatTexts = [];
    toppingSpawnTimer = 0.3;
    orderSpawnTimer = 0.8;
    stats = { orders: 0, correct: 0, wrong: 0 };
    pointerTargetX = null;
    cup.x = width / 2;
    cup.y = height - CONFIG.cup.bottomMargin - CONFIG.cup.height;
    updateHUD();
    mainScreen.classList.add('hidden');
    pauseScreen.classList.add('hidden');
    endScreen.classList.add('hidden');
}

function endGame() {
    state = 'ended';
    const finalScore = score;

    let rating = '一般';
    if (finalScore >= 250) rating = '优秀';
    else if (finalScore >= 150) rating = '良好';

    finalScoreEl.textContent = finalScore;
    finalRatingEl.textContent = rating;
    orderCountEl.textContent = stats.orders;
    correctCountEl.textContent = stats.correct;
    wrongCountEl.textContent = stats.wrong;

    endScreen.classList.remove('hidden');
}

// ================= 输入处理 =================
canvas.addEventListener('pointerdown', (e) => {
    if (state !== 'playing') return;
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    // 判断是否点在了杯子范围内（稍微放宽一点，方便按中）
    const w = CONFIG.cup.width;
    const h = CONFIG.cup.height;
    const left = cup.x - w / 2 - 10;
    const right = cup.x + w / 2 + 10;
    const top = cup.y - 20;
    const bottom = cup.y + h + 10;

    if (mx >= left && mx <= right && my >= top && my <= bottom) {
        isDragging = true;
        dragOffsetX = mx - cup.x;   // 记录按住的位置相对杯子中心的偏移
        lastInput = 'pointer';
        pointerTargetX = cup.x;
    }
});

canvas.addEventListener('pointermove', (e) => {
    if (state !== 'playing' || !isDragging) return;
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    pointerTargetX = mx - dragOffsetX;  // 跟随鼠标，但保留按下时的抓取偏移
    lastInput = 'pointer';
});

canvas.addEventListener('pointerup', () => {
    isDragging = false;
});

canvas.addEventListener('pointercancel', () => {
    isDragging = false;
});

// 鼠标移出 canvas 时也要释放拖拽状态
canvas.addEventListener('pointerleave', () => {
    isDragging = false;
});

document.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (k === 'a') { keys.a = true; lastInput = 'keyboard'; }
    if (k === 'd') { keys.d = true; lastInput = 'keyboard'; }
});

document.addEventListener('keyup', (e) => {
    const k = e.key.toLowerCase();
    if (k === 'a') keys.a = false;
    if (k === 'd') keys.d = false;
});

// ================= 按钮事件 =================
document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('restart-btn').addEventListener('click', startGame);

document.getElementById('pause-btn').addEventListener('click', () => {
    if (state === 'playing') {
        state = 'paused';
        pauseScreen.classList.remove('hidden');
    }
});

document.getElementById('resume-btn').addEventListener('click', () => {
    if (state === 'paused') {
        state = 'playing';
        pauseScreen.classList.add('hidden');
        lastTime = 0;
    }
});

document.getElementById('quit-btn').addEventListener('click', () => {
    if (state === 'paused') {
        pauseScreen.classList.add('hidden');
        endGame();
    }
});

document.getElementById('home-btn').addEventListener('click', () => {
    endScreen.classList.add('hidden');
    mainScreen.classList.remove('hidden');
    state = 'ready';
    score = 0;
    toppings = [];
    orders = [];
    particles = [];
    floatTexts = [];
    updateHUD();
});

// ================= 启动 =================
resize();
cup.x = width / 2;
cup.y = height - CONFIG.cup.bottomMargin - CONFIG.cup.height;
updateHUD();
requestAnimationFrame(gameLoop);
</script>
</body>
